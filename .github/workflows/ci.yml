name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scorecard tests
        run: python -m pytest tests -q

      - name: Scorecard vs challenger
        run: python run_scorecard.py

      - name: Fair lending analysis
        run: python run_fair_lending.py

      - name: Vintage stability and intervals
        run: python run_stability.py
